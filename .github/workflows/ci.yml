name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly retrieval check, 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (no network, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-api.txt
            requirements-dev.txt
      - run: pip install -r requirements-core.txt -r requirements-api.txt -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Docker image builds and behaves
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-api:ci .
      - name: Start container
        run: docker run -d --name rag-api -p 8000:8000 -e RAG_API_KEY=ci-key rag-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs rag-api
          exit 1
      - name: API key is enforced
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/ask \
            -H "Content-Type: application/json" -d '{"doc_id":"0123456789abcdef","question":"q"}')
          echo "status without key: $code"
          test "$code" = "401"
      - name: Not root, and no .env in the image
        run: docker run --rm --entrypoint sh rag-api:ci -c 'test "$(id -u)" != "0" && ! test -e /app/.env'

  retrieval-gate:
    name: Retrieval quality gate (real embeddings)
    runs-on: ubuntu-latest
    needs: tests
    # secrets are never given to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      RAG_DATA_DIR: ${{ github.workspace }}/data
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret exists
        id: key
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::warning::GOOGLE_API_KEY secret is not set - skipping the retrieval gate"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-api.txt
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: pip install -r requirements-core.txt -r requirements-api.txt
      - name: Cache the document index (re-embeds only when the corpus or the embedding code changes)
        if: steps.key.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: data
          key: eval-index-${{ hashFiles('evaluation/corpus/*.pdf', 'core/document_loader.py', 'core/embeddings.py') }}
      - name: Gate - development set
        if: steps.key.outputs.present == 'true'
        run: python -m evaluation.run_retrieval_eval --mode hybrid --report evaluation/report_dev.json
      - name: Gate - held-out set
        if: steps.key.outputs.present == 'true'
        run: python -m evaluation.run_retrieval_eval --mode hybrid --golden evaluation/golden_heldout.json --report evaluation/report_heldout.json
      - name: Keep the reports
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-reports
          path: evaluation/report_*.json